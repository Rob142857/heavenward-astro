<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e1a" />
    <meta
      name="description"
      content="Dusk-till-dawn astronomical event report for your location"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sky.incitat.io/about" />
    <meta property="og:title" content="Heavenward — Tonight's Sky" />
    <meta
      property="og:description"
      content="See what is worth observing in tonight's sky, right where you are."
    />
    <meta
      property="og:image"
      content="https://sky.incitat.io/icons/icon-512.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Heavenward — Tonight's Sky" />
    <meta
      name="twitter:description"
      content="See what is worth observing in tonight's sky, right where you are."
    />
    <meta
      name="twitter:image"
      content="https://sky.incitat.io/icons/icon-512.png"
    />
    <title>Heavenward — Tonight's Sky</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      /* Inline boot paint so the dark theme + spinning seba are visible
         before the JS bundle finishes loading. Removed once #app has
         rendered content. */
      html, body { background: #0a0e1a; color: #e0e6f0; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height: 100vh; }
      #boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: #0a0e1a;
        z-index: 9999;
        transition: opacity 350ms ease;
      }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      #boot-splash svg {
        width: 76px; height: 76px;
        filter: drop-shadow(0 0 8px rgba(245, 230, 163, 0.45));
        animation: boot-spin 2.4s cubic-bezier(.4,.0,.2,1) infinite;
      }
      #boot-splash .boot-label {
        font-family: "Cinzel", Georgia, serif;
        font-size: 1.1rem; letter-spacing: 0.32em; text-transform: uppercase;
        color: #d4af37;
        opacity: 0.9;
        animation: boot-pulse 2.4s ease-in-out infinite;
      }
      @keyframes boot-spin {
        0%   { transform: rotate(0deg)   scale(0.92); }
        50%  { transform: rotate(180deg) scale(1.04); }
        100% { transform: rotate(360deg) scale(0.92); }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg { animation: none; }
        #boot-splash .boot-label { animation: none; opacity: 0.9; }
      }
      #boot-recovery {
        text-align: center;
        max-width: 30ch;
        animation: none;
      }
      #boot-recovery p {
        margin: 0 0 14px;
        font-size: 0.9rem;
        line-height: 1.5;
        color: #9aa4b8;
      }
      #boot-recovery button {
        min-height: 44px;
        padding: 10px 22px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 10px;
        background: rgba(212, 175, 55, 0.1);
        color: #d4af37;
        font-size: 0.9rem;
        font-family: inherit;
        cursor: pointer;
      }
      #boot-recovery button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="boot-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c5a44e"/>
            <stop offset="50%" stop-color="#f5e6a3"/>
            <stop offset="100%" stop-color="#d4af37"/>
          </linearGradient>
        </defs>
        <g transform="translate(50,50)" fill="url(#boot-grad)">
          <circle r="4.5"/>
          <path d="M0,-7Q-3.5,-22 0,-44Q3.5,-22 0,-7Z"/>
          <path d="M0,-7Q-3.5,-22 0,-44Q3.5,-22 0,-7Z" transform="rotate(72)"/>
          <path d="M0,-7Q-3.5,-22 0,-44Q3.5,-22 0,-7Z" transform="rotate(144)"/>
          <path d="M0,-7Q-3.5,-22 0,-44Q3.5,-22 0,-7Z" transform="rotate(216)"/>
          <path d="M0,-7Q-3.5,-22 0,-44Q3.5,-22 0,-7Z" transform="rotate(288)"/>
        </g>
      </svg>
      <div class="boot-label">Heavenward</div>
      <div id="boot-recovery" hidden>
        <p>The sky is taking longer than it should.</p>
        <button type="button" id="boot-recovery-btn">Reset and try again</button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      /*
       * Boot watchdog. Deliberately a classic (non-module) inline script: if
       * the module bundle 404s — which is exactly what a half-updated service
       * worker causes after a deploy — then no application code runs at all,
       * and anything living in main.ts could never recover from it. Without
       * this the splash spins forever and the app looks dead, with no route
       * back short of knowing to clear site data or open a private window.
       */
      (function () {
        var GRACE_MS = 12000;
        window.setTimeout(function () {
          var app = document.getElementById("app");
          if (app && app.children.length > 0) return; // booted fine
          var recovery = document.getElementById("boot-recovery");
          if (recovery) recovery.hidden = false;
        }, GRACE_MS);

        var btn = document.getElementById("boot-recovery-btn");
        if (!btn) return;
        btn.addEventListener("click", function () {
          btn.disabled = true;
          btn.textContent = "Resetting…";
          // Tear down the two things that can pin a browser to a broken
          // build: the service worker and its caches. User data lives in
          // localStorage and is deliberately left untouched.
          var jobs = [];
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          Promise.all(jobs)["catch"](function () {})["then"](function () {
            // Cache-busting param so the reload cannot be answered from the
            // HTTP cache with the same broken document.
            location.replace(location.pathname + "?reset=" + Date.now());
          });
        });
      })();
    </script>
  </body>
</html>
